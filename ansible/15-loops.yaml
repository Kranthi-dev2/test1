- name: loops
  hosts: localhost
  become: yes
  tasks:
  - name: install or uninstall packages
    ansible.builtin.package:
      name: "{{item}}"   # item is default keyword for loops
      state: present # it will install
    loop: 
    - {name: 'git', state: 'present'}
    - {name: 'python', state: 'absent'}
    - {name: 'mysql', state: 'absent'}
    - {name: 'nginx', state: 'present'}