- name: conditions
  hosts: localhost
  tasks:
  - name: check roboshop user is exists or not
    ansible.builtin.command: id roboshop
    register: user # 'id roboshop' command output stores in this user variable
    ignore_errors: true # it will bypass the error and ignoresif error occurs

  - name: print the value
    ansible.builtin.debug:
      msg: "user output is: {{user}}"

  - name: print RC value
    ansible.builtin.debug:
      msg: "exit status is: {{user.rc}}"

  - name: create user
    ansible.builtin.user:
      name: roboshop
    when: user.rc != 0 #condtion if rc not eq 0,then only create roboshop user